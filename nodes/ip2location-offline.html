<script type="text/javascript">
(function() { RED.nodes.registerType('ip2location-offline', {
  category:'IP2Location', color:'#89C4DA', defaults:{name:{value:''},binPath:{value:'',required:true}},
  inputs:1, outputs:1, icon:'font-awesome/fa-globe',
  label:function() { return this.name || 'IP2Location BIN'; },
  paletteLabel:'IP2Location BIN'
}); })();
</script>
<script type="text/html" data-template-name="ip2location-offline">
  <div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div>
  <div class="form-row"><label for="node-input-binPath">BIN file</label><input id="node-input-binPath" type="text" placeholder="Absolute BIN file path"></div>
</script>
<script type="text/html" data-help-name="ip2location-offline">
  <p>Offline lookups using a local IP2Location BIN database. No API key or internet connection required.</p>
  <h3>Input</h3><p>Provide <code>msg.ip</code> (preferred) or an IP string in <code>msg.payload</code>. Set <code>msg.reload = true</code> to reopen the configured BIN after a database update. Otherwise, redeploy to reload it.</p>
  <h3>Output</h3><p>SDK object in <code>msg.payload</code>. Available fields depend on BIN package (for example countryShort, countryLong, region, city, latitude, longitude). Offline SDK field names differ from IP2Location.io responses and typically use camelCase such as <code>countryShort</code>, rather than API <code>country_code</code>.</p>
  <h3>Errors</h3><p>Use a Catch node for invalid/missing BINs and unsupported IP types. IPv6 against an IPv4-only BIN returns <code>IPV6_NOT_SUPPORTED</code>, which is reported as an error instead of a successful lookup.</p>
</script>
