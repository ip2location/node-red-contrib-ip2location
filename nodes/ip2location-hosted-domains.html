<script type="text/html" data-help-name="ip2location-hosted-domains">
  <p>List domains hosted on an IP address. Fetches a single page per message.</p>
  <h3>Input</h3><p>Supply <code>msg.ip</code> or <code>msg.payload</code>. <code>msg.page</code> overrides the configured page and must be a positive integer.</p>
  <h3>Output</h3><p>The Hosted Domains API response is returned unchanged in <code>msg.payload</code>; other message properties are preserved.</p>
  <h3>Errors</h3><p>Use a Catch node for input errors, timeouts, API failures, or insufficient credits (10004).</p>
</script>
