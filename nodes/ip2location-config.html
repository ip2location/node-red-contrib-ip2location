<script type="text/javascript">
(function() { RED.nodes.registerType('ip2location-config', {
  category:'config', defaults:{name:{value:''}}, credentials:{apiKey:{type:'password'}},
  label:function(){ return this.name || 'IP2Location.io credentials'; }
}); })();
</script>
<script type="text/html" data-template-name="ip2location-config">
  <div class="form-row"><label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label><input id="node-config-input-name" type="text" placeholder="IP2Location.io"></div>
  <div class="form-row"><label for="node-config-input-apiKey"><i class="fa fa-key"></i> API key</label><input id="node-config-input-apiKey" type="password" placeholder="Leave blank for keyless IP lookups"></div>
</script>
<script type="text/html" data-help-name="ip2location-config">
  <p>Stores the IP2Location.io API key using Node-RED credentials. The key is not exported with normal flow JSON.</p>
  <p>Leave blank for limited keyless geolocation lookups (1,000 requests per day). WHOIS and Hosted Domains require an API key.</p>
</script>
